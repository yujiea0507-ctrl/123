<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店務對帳系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>body { background-color: #FDFBF7; color: #4A3F35; }</style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto p-4 min-h-screen">
        <header class="mb-6"><h1 class="text-2xl font-bold text-[#6F4E37]">每日對帳輸入</h1></header>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-[#EBE3D5] mb-6">
            <div class="grid grid-cols-2 gap-3">
                <label class="text-xs text-gray-500">現金</label><label class="text-xs text-gray-500">熊貓</label>
                <input v-model.number="form.cash" type="number" class="p-2 border rounded">
                <input v-model.number="form.panda" type="number" class="p-2 border rounded">
                <label class="text-xs text-gray-500">UBER</label><label class="text-xs text-gray-500">LinePay</label>
                <input v-model.number="form.uber" type="number" class="p-2 border rounded">
                <input v-model.number="form.lp" type="number" class="p-2 border rounded">
                <label class="text-xs text-gray-500">全支付</label><span></span>
                <input v-model.number="form.allpay" type="number" class="p-2 border rounded">
                <label class="text-xs text-gray-500 col-span-2">交班實際總金額 (結帳用)</label>
                <input v-model.number="form.actual" type="number" class="p-2 border rounded col-span-2 border-[#6F4E37] border-2">
                <button @click="addData" class="col-span-2 bg-[#6F4E37] text-white p-3 rounded-lg font-bold">送出並計算帳差</button>
            </div>
        </div>

        <div class="space-y-4">
            <div v-for="day in dailyData" :key="day.date" class="bg-white p-4 rounded-xl shadow-sm border border-[#EBE3D5]">
                <div class="flex justify-between font-bold mb-2 text-[#6F4E37]">
                    <span>{{ day.date }}</span>
                    <span>帳差: {{ day.diff }}</span>
                </div>
                <div class="text-xs text-gray-500">系統總計: {{ day.total }} / 實際交班: {{ day.actual }}</div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() { return { form: { cash: '', panda: '', uber: '', lp: '', allpay: '', actual: '' }, dailyData: [] } },
            methods: {
                addData() {
                    const total = (this.form.cash || 0) + (this.form.panda || 0) + (this.form.uber || 0) + (this.form.lp || 0) + (this.form.allpay || 0);
                    const diff = (this.form.actual || 0) - total;
                    this.dailyData.unshift({ ...this.form, total, diff, date: new Date().toLocaleDateString() });
                    this.form = { cash: '', panda: '', uber: '', lp: '', allpay: '', actual: '' };
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
