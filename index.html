<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>店務 ERP 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>body { background-color: #FDFBF7; color: #4A3F35; }</style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto p-4 min-h-screen pb-20">
        <header class="mb-6"><h1 class="text-2xl font-bold text-[#6F4E37]">店務管理 ERP</h1></header>

        <div class="flex bg-white p-1 rounded-xl shadow-sm mb-6 border border-[#EBE3D5]">
            <button @click="currentTab = 'daily'" :class="currentTab === 'daily' ? 'bg-[#6F4E37] text-white' : 'text-gray-500'" class="flex-1 py-2 rounded-lg font-bold">每日對帳</button>
            <button @click="currentTab = 'ab'" :class="currentTab === 'ab' ? 'bg-[#6F4E37] text-white' : 'text-gray-500'" class="flex-1 py-2 rounded-lg font-bold">庫存盤點</button>
        </div>

        <div v-if="currentTab === 'daily'">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-[#EBE3D5] mb-6">
                <div class="grid grid-cols-2 gap-3">
                    <button @click="showModal = true" class="col-span-2 p-3 bg-[#EBE3D5] rounded-lg font-bold text-[#6F4E37] border-2 border-[#6F4E37]">
                        {{ form.cash > 0 ? '$ ' + form.cash : '點擊點算現金' }}
                    </button>
                    <input v-model.number="form.panda" placeholder="熊貓" class="p-2 border rounded">
                    <input v-model.number="form.uber" placeholder="UBER" class="p-2 border rounded">
                    <input v-model.number="form.lp" placeholder="LinePay" class="p-2 border rounded">
                    <input v-model.number="form.allpay" placeholder="全支付" class="p-2 border rounded">
                    <input v-model.number="form.actual" placeholder="實際總額" class="p-2 border rounded col-span-2 border-[#6F4E37] border-2">
                    <input v-model="form.note" placeholder="備註..." class="p-2 border rounded col-span-2">
                    <button @click="verifyAndSave" class="col-span-2 bg-[#6F4E37] text-white p-3 rounded-lg font-bold">送出並記錄</button>
                </div>
            </div>
            <div class="space-y-3">
                <div v-for="(day, index) in dailyData" :key="index" class="bg-white p-4 rounded-xl shadow-sm border border-[#EBE3D5] text-sm">
                    <div class="flex justify-between font-bold text-[#6F4E37]">
                        <span>{{ day.date }} {{ day.time }}</span>
                        <span>營收: {{ day.total }}</span>
                    </div>
                    <div class="text-xs text-gray-500 mt-1">帳差: {{ day.diff }} | 備註: {{ day.note }}</div>
                </div>
            </div>
        </div>

        <div v-if="currentTab === 'ab'">
            <div class="space-y-4">
                <div v-for="(item, idx) in inventory" :key="idx" class="bg-white p-4 rounded-xl shadow-sm border border-[#EBE3D5]">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-[#6F4E37]">{{ item.name }}</span>
                        <span class="text-xs">帳面庫存: <strong class="text-[#6F4E37]">{{ item.stock }}</strong></span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input v-model.number="item.qty" type="number" placeholder="數量" class="p-2 border rounded">
                        <div class="flex gap-1">
                            <button @click="updateStock(idx, 'out')" class="flex-1 bg-red-100 text-red-700 text-xs rounded font-bold">領料</button>
                            <button @click="updateStock(idx, 'in')" class="flex-1 bg-green-100 text-green-700 text-xs rounded font-bold">補貨</button>
                        </div>
                    </div>
                    <div class="bg-gray-50 p-2 rounded flex items-center justify-between mt-2">
                        <input v-model.number="item.actualCount" type="number" placeholder="實際量" class="p-1 w-16 border rounded text-xs">
                        <button @click="checkInventory(idx)" class="bg-[#6F4E37] text-white px-2 py-1 text-xs rounded">盤點</button>
                        <span class="text-xs font-bold">{{ item.diff !== undefined ? '差:' + item.diff : '' }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() { return { 
                currentTab: 'daily',
                form: { cash: 0, panda: 0, uber: 0, lp: 0, allpay: 0, actual: 0, note: '' },
                dailyData: [],
                inventory: JSON.parse(localStorage.getItem('inv') || '[]')
            }},
            mounted() {
                // 核心救資料邏輯：檢查舊鑰匙是否有資料
                const oldData = localStorage.getItem('myDailyData');
                const newData = localStorage.getItem('dailyData');
                if (oldData && !newData) {
                    this.dailyData = JSON.parse(oldData);
                    localStorage.setItem('dailyData', oldData);
                } else if (newData) {
                    this.dailyData = JSON.parse(newData);
                }
            },
            methods: {
                verifyAndSave() {
                    const total = this.form.cash + this.form.panda + this.form.uber + this.form.lp + this.form.allpay;
                    const now = new Date();
                    this.dailyData.unshift({ ...this.form, total, diff: this.form.actual - total, date: now.toLocaleDateString(), time: now.getHours()+':'+now.getMinutes() });
                    localStorage.setItem('dailyData', JSON.stringify(this.dailyData));
                    this.form = { cash: 0, panda: 0, uber: 0, lp: 0, allpay: 0, actual: 0, note: '' };
                },
                updateStock(idx, type) {
                    const item = this.inventory[idx];
                    if (type === 'out') item.stock -= item.qty; else item.stock += item.qty;
                    item.qty = 0;
                    localStorage.setItem('inv', JSON.stringify(this.inventory));
                },
                checkInventory(idx) {
                    const item = this.inventory[idx];
                    item.diff = item.actualCount - item.stock;
                    item.stock = item.actualCount;
                    localStorage.setItem('inv', JSON.stringify(this.inventory));
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
