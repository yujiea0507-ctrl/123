<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店務管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>body { background-color: #FDFBF7; color: #4A3F35; }</style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto p-4 min-h-screen">
        <header class="mb-6"><h1 class="text-2xl font-bold text-[#6F4E37]">財務輸入系統</h1></header>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-[#EBE3D5] mb-6">
            <h2 class="font-bold mb-3">新增今日帳目</h2>
            <div class="grid grid-cols-2 gap-3">
                <input v-model.number="form.cash" type="number" placeholder="現金" class="p-2 border rounded">
                <input v-model.number="form.panda" type="number" placeholder="熊貓" class="p-2 border rounded">
                <input v-model.number="form.uber" type="number" placeholder="UBER" class="p-2 border rounded">
                <input v-model.number="form.lp" type="number" placeholder="LinePay" class="p-2 border rounded">
                <input v-model.number="form.allpay" type="number" placeholder="全支付" class="p-2 border rounded">
                <button @click="addData" class="bg-[#6F4E37] text-white rounded-lg font-bold">送出</button>
            </div>
        </div>

        <div class="space-y-4">
            <div v-for="day in dailyData" :key="day.date" class="bg-white p-4 rounded-xl shadow-sm border border-[#EBE3D5]">
                <div class="font-bold mb-2">{{ day.date }}</div>
                <div class="grid grid-cols-3 gap-2 text-xs text-gray-600">
                    <p>現金: {{ day.cash }}</p> <p>熊貓: {{ day.panda }}</p> <p>UBER: {{ day.uber }}</p>
                    <p>LinePay: {{ day.lp }}</p> <p>全支付: {{ day.allpay }}</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    form: { cash: '', panda: '', uber: '', lp: '', allpay: '' },
                    dailyData: []
                }
            },
            methods: {
                addData() {
                    const newEntry = { ...this.form, date: new Date().toLocaleDateString() };
                    this.dailyData.unshift(newEntry);
                    this.form = { cash: '', panda: '', uber: '', lp: '', allpay: '' };
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
